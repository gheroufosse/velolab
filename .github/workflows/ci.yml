name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects which parts of the monorepo changed, so backend-only work does not
  # run frontend jobs and vice versa.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      # apps/web has no package.json until Stage 3. Until then, skip the
      # rest of this job rather than fail when this workflow file itself
      # changes (job-level `if:` runs before checkout, so it can't test
      # for the lockfile directly — hence this step-level guard).
      - name: Check if frontend is scaffolded
        id: scaffolded
        run: |
          if [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.scaffolded.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
        if: steps.scaffolded.outputs.ready == 'true'

      - name: Type check
        if: steps.scaffolded.outputs.ready == 'true'
        run: npx tsc --noEmit

      - name: Lint
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm run lint

      - name: Tests
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm test

  # Always-green aggregate check. Branch protection requires this one job,
  # so skipped path-filtered jobs do not block a merge.
  ci:
    needs: [api, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "A CI job failed."
            exit 1
          fi
          echo "CI passed."
