name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancel superseded runs on the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Detects which parts of the monorepo changed, so backend-only work does not
  # run frontend jobs and vice versa.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'scripts/check.sh'
              - 'infra/test-db/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/web/**'
              - '.github/workflows/ci.yml'

  api:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    env:
      TEST_DB_PROJECT: velolab-test-${{ github.run_id }}-${{ github.run_attempt }}
      TEST_POSTGRES_HOST: 127.0.0.1
      TEST_POSTGRES_PORT: '5435'
      TEST_POSTGRES_USER: velolab_test_runner
      TEST_POSTGRES_DB: velolab_test_admin
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        working-directory: apps/api
        run: uv sync --locked --all-extras --dev

      - name: Generate disposable database credentials
        id: credentials
        run: |
          bootstrap=$(openssl rand -hex 32)
          runner=$(openssl rand -hex 32)
          while [ "$runner" = "$bootstrap" ]; do runner=$(openssl rand -hex 32); done
          echo "::add-mask::$bootstrap"
          echo "::add-mask::$runner"
          printf 'bootstrap=%s\nrunner=%s\n' "$bootstrap" "$runner" >> "$GITHUB_OUTPUT"

      - name: Start disposable PostgreSQL
        env:
          TEST_POSTGRES_BOOTSTRAP_PASSWORD: ${{ steps.credentials.outputs.bootstrap }}
          TEST_POSTGRES_PASSWORD: ${{ steps.credentials.outputs.runner }}
        run: |
          timeout 300s docker compose --env-file /dev/null -p "$TEST_DB_PROJECT" \
            -f infra/test-db/compose.yaml up -d --wait --wait-timeout 120

      - name: API checks (including PostgreSQL integration tests)
        env:
          VELOLAB_TEST_DATABASE: '1'
          TEST_POSTGRES_PASSWORD: ${{ steps.credentials.outputs.runner }}
        run: ./scripts/check.sh

      - name: Discard disposable PostgreSQL
        if: always()
        env:
          # down interpolates these values but does not authenticate with them.
          TEST_POSTGRES_BOOTSTRAP_PASSWORD: unused
          TEST_POSTGRES_PASSWORD: unused
        run: |
          docker compose --env-file /dev/null -p "$TEST_DB_PROJECT" \
            -f infra/test-db/compose.yaml down --volumes --remove-orphans

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7

      # apps/web has no package.json until Stage 3. Until then, skip the
      # rest of this job rather than fail when this workflow file itself
      # changes (job-level `if:` runs before checkout, so it can't test
      # for the lockfile directly — hence this step-level guard).
      - name: Check if frontend is scaffolded
        id: scaffolded
        run: |
          if [ -f package-lock.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.scaffolded.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci
        if: steps.scaffolded.outputs.ready == 'true'

      - name: Type check
        if: steps.scaffolded.outputs.ready == 'true'
        run: npx tsc --noEmit

      - name: Lint
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm run lint

      - name: Tests
        if: steps.scaffolded.outputs.ready == 'true'
        run: npm test

  # Stable branch-protection check; only jobs skipped by path filtering may pass.
  ci:
    needs: [changes, api, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          API_RESULT: ${{ needs.api.result }}
          WEB_RESULT: ${{ needs.web.result }}
          API_CHANGED: ${{ needs.changes.outputs.api }}
          WEB_CHANGED: ${{ needs.changes.outputs.web }}
        run: |
          if [ "$CHANGES_RESULT" != success ] || \
             { [ "$API_CHANGED" != true ] && [ "$API_CHANGED" != false ]; } || \
             { [ "$WEB_CHANGED" != true ] && [ "$WEB_CHANGED" != false ]; } || \
             { [ "$API_CHANGED" = true ] && [ "$API_RESULT" != success ]; } || \
             { [ "$API_CHANGED" = false ] && [ "$API_RESULT" != skipped ]; } || \
             { [ "$WEB_CHANGED" = true ] && [ "$WEB_RESULT" != success ]; } || \
             { [ "$WEB_CHANGED" = false ] && [ "$WEB_RESULT" != skipped ]; }; then
            echo "Unexpected CI results: changes=$CHANGES_RESULT api=$API_RESULT web=$WEB_RESULT"
            exit 1
          fi
          echo "CI passed."
