name: Bug
description: Something behaves incorrectly
labels: ["type:bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [api, web, infra, sync, auth]
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What should happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What happens instead? Paste exact error output.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Anything already ruled out?
