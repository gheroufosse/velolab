[project]
name = "velolab-api"
version = "0.1.0"
description = "velolab FastAPI backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
velolab-api = "velolab_api:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.12"
root = ["./src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
