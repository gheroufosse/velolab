[project]
name = "velolab-api"
version = "0.1.0"
description = "velolab FastAPI backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.10.1,<3",
    "sqlalchemy>=2.1.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
velolab-api = "velolab_api:main"
velolab-provision-user = "velolab_api.provision_cli:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

[tool.ty.environment]
python-version = "3.14"
root = ["./src", "."]
python = "./.venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
